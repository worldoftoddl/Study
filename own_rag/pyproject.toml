[project]
name = "own-rag"
version = "0.1.0"
description = "K-IFRS RAG — Dense + Hybrid (BM25/kiwipiepy) 검색 파이프라인"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── LangChain 0.3.x 생태계 ──
    "langchain>=0.3.13,<0.4",
    "langchain-anthropic>=0.3.15,<0.4",
    "langchain-community>=0.3.13,<0.4",
    "langchain-huggingface>=0.1.2,<0.2",
    "langchain-qdrant>=0.2.1,<0.3",
    "langgraph>=0.2.60,<0.3",

    # ── 벡터 DB / 검색 ──
    "qdrant-client>=1.17.0,<2",
    "rank-bm25>=0.2.2",

    # ── 한국어 형태소 분석 ──
    "kiwipiepy>=0.22.2",

    # ── 유틸 ──
    "python-dotenv>=1.0.1",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.10",
]
